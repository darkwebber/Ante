name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The native backend (M7) compiles test programs with clang.
      - name: clang on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - run: clang --version
      - run: cargo test --workspace
        env:
          RUSTFLAGS: -D warnings
          ANTE_REQUIRE_NATIVE: "1"

  msrv:
    name: test (MSRV 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Every native test program again, built with AddressSanitizer and UBSan:
  # a double free, use after free or overflow in generated code or the
  # runtime fails the test. Leak checking is off while closure environments
  # are still never freed.
  sanitizers:
    name: native (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clang with sanitizers
        run: |
          printf '#!/bin/sh\nexec clang -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g "$@"\n' > "$RUNNER_TEMP/asan-cc"
          chmod +x "$RUNNER_TEMP/asan-cc"
          echo "ANTE_CC=$RUNNER_TEMP/asan-cc" >> "$GITHUB_ENV"
      - run: cargo test --release --test native
        env:
          ANTE_REQUIRE_NATIVE: "1"
          # The runtime turns a stack overflow into T08 itself. Leaks are
          # checked when a program ends normally; a trap ends it at once
          # (spec §20.3), without the exit-time check.
          ASAN_OPTIONS: handle_segv=0:handle_sigbus=0:detect_leaks=1

  editor:
    name: editor grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package

  # One required check for branch protection, so the job list can change freely.
  ci-ok:
    name: CI ok
    if: always()
    needs: [fmt, clippy, test, msrv, sanitizers, editor]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."
            exit 1
          fi
