name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The native backend (M7) compiles test programs with clang.
      - name: clang on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - run: clang --version
      - run: cargo test --workspace
        env:
          RUSTFLAGS: -D warnings
          ANTE_REQUIRE_NATIVE: "1"

  msrv:
    name: test (MSRV 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Every native test program again, built with AddressSanitizer and UBSan:
  # a double free, use after free or overflow in generated code or the
  # runtime fails the test. Leak checking is off while closure environments
  # are still never freed.
  sanitizers:
    name: native (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clang with sanitizers
        run: |
          printf '#!/bin/sh\nexec clang -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g "$@"\n' > "$RUNNER_TEMP/asan-cc"
          chmod +x "$RUNNER_TEMP/asan-cc"
          echo "ANTE_CC=$RUNNER_TEMP/asan-cc" >> "$GITHUB_ENV"
      - run: cargo test --release --test native
        env:
          ANTE_REQUIRE_NATIVE: "1"
          # The runtime turns a stack overflow into T08 itself. Leaks are
          # checked when a program ends normally; a trap ends it at once
          # (spec §20.3), without the exit-time check.
          ASAN_OPTIONS: handle_segv=0:handle_sigbus=0:detect_leaks=1

  editor:
    name: editor grammar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package

  # install.sh, offline: the binary this commit builds, packaged the way
  # release.yml packages it, served from a folder, then a first project.
  install:
    name: install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: cargo build --release -p antec
      - name: Install from a local release folder
        shell: bash
        run: |
          target="$(uname -m | sed 's/arm64/aarch64/')-$([ "$(uname -s)" = Darwin ] && echo apple-darwin || echo unknown-linux-gnu)"
          name="antec-v0.0.0-$target"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist/$name"
          cp target/release/antec "$dist/$name/"
          (cd "$dist" && tar czf "$name.tar.gz" "$name" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          ANTE_VERSION=v0.0.0 ANTE_DIST="file://$dist" ANTE_HOME="$RUNNER_TEMP/ante" ANTE_NO_MODIFY_PATH=1 sh install.sh
          echo "$RUNNER_TEMP/ante/bin" >> "$GITHUB_PATH"
      - name: First project, away from the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          antec new naa_project
          cd naa_project
          antec run --interp | grep -q "Hello World"
          antec pariksha
          printf 'x ante 20\nx + 1\n' | antec repl | grep -qx 21

  # One required check for branch protection, so the job list can change freely.
  ci-ok:
    name: CI ok
    if: always()
    needs: [fmt, clippy, test, msrv, sanitizers, editor, install]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."
            exit 1
          fi
